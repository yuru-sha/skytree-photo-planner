name: Refresh root Express type lockfile

on:
  push:
    branches:
      - fix/root-express-5-types

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm install --package-lock-only || (rm package-lock.json && npm install --package-lock-only)
      - run: npm ci
      - name: Commit lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-root-express-types.yml
          git commit -m "chore: refresh Express type lockfile"
          git push
