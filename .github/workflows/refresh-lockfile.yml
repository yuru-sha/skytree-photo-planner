name: Refresh dependency lockfile
on:
  push:
    branches: [chore/issue-17-tailwind-v4]
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: rm -rf node_modules package-lock.json && npm install
      - run: npm run build:packages
      - run: npm run build:client
      - name: Commit generated lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-lockfile.yml
          git commit -m "chore: refresh package lockfile"
          git push
