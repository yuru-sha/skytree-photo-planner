name: Validate server ESM migration

on:
  push:
    branches:
      - refactor/issue-55-server-esm

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck --workspace=apps/server
      - run: npm run test --workspace=apps/server
      - run: npm run build:server
      - name: Remove validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-server-esm.yml
          git commit -m "ci: remove server ESM validation workflow"
          git push
